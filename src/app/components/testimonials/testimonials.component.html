<div class="testimonials-wrapper">
  <h2 class="section-title">Peer <span>Recommendations</span></h2>

  <div class="testimonials-grid">
    <div class="testimonial-card glass-card" *ngFor="let t of testimonials" data-aos="fade-up">
      <!-- Quote icon styling -->
      <div class="quote-icon">
        <span class="material-icons">format_quote</span>
      </div>

      <p class="testimonial-message">“{{ t.message }}”</p>

      <div class="author-block">
        <img [src]="t.image" alt="{{ t.name }}" class="author-img" />
        <div class="author-info">
          <h3 class="author-name">{{ t.name }}</h3>
          <p class="author-title">{{ t.title }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
