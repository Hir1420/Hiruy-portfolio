<section class="projects" id="projects">
  <h2>Projects</h2>
  <div class="project-grid">
    <div class="project-card" *ngFor="let project of projects">
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      <div class="tags">
        <span *ngFor="let tech of project.tech">{{ tech }}</span>
      </div>
    </div>
  </div>
</section>
