<div class="projects-wrapper">
  <h2 class="section-title">Featured <span>Projects</span></h2>

  <div class="projects-grid">
    <div class="project-card glass-card" *ngFor="let project of projects" data-aos="fade-up">
      <!-- Simulated OS UI Window Frame -->
      <div class="project-visual">
        <div class="window-header">
          <div class="window-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div class="window-address">
            <span class="material-icons">lock_outline</span>
            <span class="url-text">{{ project.title.toLowerCase().replace(' ', '-') }}.dev</span>
          </div>
        </div>
        <div class="window-body">
          <div class="role-badge">{{ project.role }}</div>
          <div class="visual-grid">
            <div class="grid-cell fill-accent"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell fill-secondary"></div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="project-details">
        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <div class="project-tech-badges">
          <span class="badge" *ngFor="let t of project.tech">{{ t }}</span>
        </div>

        <div class="project-footer">
          <a *ngIf="project.liveLink" [href]="project.liveLink" target="_blank" class="btn btn-secondary btn-sm-link">
            <span class="material-icons">open_in_new</span> Live Platform
          </a>
          
          <div *ngIf="!project.liveLink" class="enterprise-tag">
            <span class="material-icons">security</span>
            <span>Enterprise System</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
